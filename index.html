<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum Edubiz Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EE;--surface:#fff;--ink:#241512;--muted:#76645f;--line:#E9DDD0;--brand:#7A1F2B;--brand-ink:#fff;--ok:#1F7A4D;--warn:#B26A00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17100F;--surface:#241A18;--ink:#F6EDE6;--muted:#B5A39B;--line:#3A2C29;--brand:#D9707E;--brand-ink:#1A0C0E;--ok:#5FCB93;--warn:#E8A94B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17100F;--surface:#241A18;--ink:#F6EDE6;--muted:#B5A39B;--line:#3A2C29;--brand:#D9707E;--brand-ink:#1A0C0E;--ok:#5FCB93;--warn:#E8A94B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}
.logo{width:56px;height:56px;flex:none;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 24px Fraunces,serif;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0}
.brand b{display:block;font:italic 600 17px/1.15 Fraunces,Georgia,serif;text-transform:uppercase;letter-spacing:.02em}
.brand span{display:block;margin-top:3px;font-size:11px;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#themeBtn{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:22px}
.hero h1{font-size:28px}.hero p{margin:8px 0 0;opacity:.92}
.search,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
textarea.inp{min-height:120px;resize:vertical;display:block}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.item .nm{flex:1;font-weight:500;font-size:14px}
.item .pr{font-weight:600;color:var(--brand);margin-top:2px}
.btn{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.5}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.del{color:#C0392B;background:transparent;border:1px solid var(--line)}
.btn.go{background:var(--brand-ink);color:var(--brand)}.btn.ghost{background:transparent;color:var(--brand-ink);border:1px solid var(--brand-ink)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;max-width:736px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.bar .tt{flex:1;font-weight:600}.bar .btn{background:var(--bg);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 2px;font-size:12px;color:var(--muted);font-weight:500}
nav button[aria-current="true"]{color:var(--brand);font-weight:600;box-shadow:inset 0 2px 0 var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line)}
.tag.Paid,.tag.Confirmed,.tag.Delivered{background:var(--ok);color:#fff}.tag.Awaiting{background:var(--warn);color:#fff}
.hero .tag{color:var(--brand-ink)}
.muted{color:var(--muted);font-size:13px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:760px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.acct{background:var(--surface);border:1px dashed var(--brand);border-radius:14px;padding:12px;margin:12px 0}
.hidden{opacity:.5}
.toast{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:80;font-size:14px;display:none;max-width:90%;text-align:center}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:800 22px Fraunces,serif;color:var(--brand)}
.pf{width:100%;max-width:440px;height:auto;border-radius:18px;display:block;margin:0 auto}
.photo{width:100%;max-height:340px;object-fit:cover;object-position:center top;border-radius:18px;display:block}
.doc{height:120px;border-radius:12px;padding:14px;filter:blur(3px)}
.doc i{display:block;height:8px;border-radius:4px;background:rgba(0,0,0,.25);margin-bottom:9px}
.wa{position:fixed;right:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:35;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:24px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
label.l{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}summary{font-weight:600;cursor:pointer}
a.plain{color:var(--brand);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.post p,.pre{white-space:pre-line;margin:8px 0}
</style>
</head>
<body>
<header>
  <div class="logo" id="hLogo">Q</div>
  <div class="brand" id="hBrand"></div>
  <button id="themeBtn" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="view"></main>
<a class="wa" id="waBtn" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">✆</a>
<div class="toast" id="toast"></div>
<div class="bar" id="bar" style="display:none"><div class="tt" id="barTxt"></div><button class="btn" id="goCheckout">Check out</button></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<nav>
  <button data-tab="home">Home</button><button data-tab="shop">Shop</button><button data-tab="updates">Updates</button><button data-tab="track">Track</button><button data-tab="admin">Admin</button><button data-tab="more">More</button>
</nav>

function pic(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.onerror=()=>toast("Could not read that image");im.src=r.result};r.readAsDataURL(file)}

const call=async(path,opt={})=>{const h={"content-type":"application/json"};if(token&&token!=="local")h.authorization="Bearer "+token;
  const r=await fetch("/api/"+path,{...opt,headers:h});let j={};try{j=await r.json()}catch(e){}

async function boot(){
  if(location.protocol==="file:"){API=localAPI;mode="local"}
  $("#view").innerHTML='<p class="muted" style="padding:20px 4px">Loading…</p>';renderHeader();
  try{token=sessionStorage.getItem("qes_tok")||""}catch(e){token=""}
  let lastErr=null,loaded=false;
  for(let i=0;i<4&&!loaded;i++){
    try{const r=await API.load();cfgd=r.configured;apply(r.data);loaded=true}
    catch(e){lastErr=e;await new Promise(res=>setTimeout(res,600*(i+1)))}
  }
  if(!loaded){$("#view").innerHTML=`<div class="card"><h3>Can’t load the site</h3><p class="muted">Check your connection and try again.</p><p class="muted" style="font-size:12px">Details: ${esc((lastErr&&lastErr.message)||"unknown")}</p><button class="btn" id="retry">Try again</button></div>`;$("#retry").onclick=boot;return}
  if(token&&cfgd){try{orders=await API.orders();unlocked=true;try{linkInfo=await API.link()}catch(e){}}catch(e){token="";unlocked=false}}else token="";
  render()}
boot();
</script>
</body>
</html>
